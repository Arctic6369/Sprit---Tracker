name: Android-Test-APK

on:
  push:
    branches: [android-app]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '21.0.11'
          cache: gradle
      - name: Android-SDK für den Build installieren
        run: bash scripts/setup-android-sdk.sh 'platforms;android-35' 'build-tools;34.0.0' 'build-tools;35.0.0'
      - run: npm ci
      - run: npm test
      - run: npm run android:sync
      - name: Test-APK bauen und Signatur prüfen
        working-directory: android
        run: |
          ./gradlew --no-daemon :app:assembleDebug
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
          unzip -Z1 app/build/outputs/apk/debug/app-debug.apk | grep -Fx assets/public/ocr/deu.traineddata
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sprit-tracker-android-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  emulator:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '21.0.11'
      - name: Android-SDK für den Emulator installieren
        run: bash scripts/setup-android-sdk.sh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sprit-tracker-android-test-apk
          path: apk
      - name: KVM für den Emulator freigeben
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@324029e2f414c084d8b15ba075288885e74aef9c # v2.34.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front none
          script: node scripts/android-smoke.mjs apk/app-debug.apk
